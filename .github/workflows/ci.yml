name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# cancel outdated PR runs, never a deploy in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and tests (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Audit dependencies (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Run tests with coverage (minimum 90%)
        run: pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml

      - name: Smoke test the API
        run: |
          uvicorn tips_splitter.main:app --port 8000 &
          sleep 3
          curl -fsS http://127.0.0.1:8000/health

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/

  terraform:
    name: Terraform (format and validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (no remote backend, no AWS credentials needed)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Security scan (Trivy config, report only)
        working-directory: .
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.1 config --exit-code 0 --severity HIGH,CRITICAL /src/infra/terraform

  image:
    name: Docker image (build, test, scan, push)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: tips-splitter:${{ github.sha }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' }}
    outputs:
      published: ${{ steps.push.outputs.published }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8000:8000 "$IMAGE"
          for i in $(seq 1 10); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          docker rm -f app

      - name: Scan image (Trivy, fails on critical)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$IMAGE"

      - name: Configure AWS credentials (OIDC)
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        id: push
        if: env.PUBLISH == 'true'
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          docker tag "$IMAGE" "$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$ECR_REPOSITORY:$GITHUB_SHA"
          echo "published=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to AWS (EC2)
    needs: [image, terraform]
    if: needs.image.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run deploy script on the server (SSM)
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "{\"commands\":[\"/opt/tips-splitter/deploy.sh $GITHUB_SHA\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          echo "Status: $STATUS"
          test "$STATUS" = "Success"

      - name: Smoke test the public URL
        run: |
          for i in $(seq 1 10); do
            curl -fsS "$APP_URL/health" && exit 0
            sleep 5
          done
          echo "App did not answer at $APP_URL" >&2
          exit 1
