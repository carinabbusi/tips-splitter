name: CI

# Runs on every push and pull request to main, and can be started by hand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the pipeline only needs to read the code.
permissions:
  contents: read

# If you push twice quickly, cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests with coverage (minimum 90%)
        run: pytest --junitxml=reports/junit.xml --cov-report=xml:reports/coverage.xml

      - name: Smoke test the API
        run: |
          uvicorn tips_splitter.main:app --port 8000 &
          sleep 3
          curl -fsS http://127.0.0.1:8000/health

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: reports/

  terraform:
    name: Terraform (format and validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init (no remote backend, no AWS credentials needed)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
