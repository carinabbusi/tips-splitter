[project]
name = "tips-splitter"
version = "0.1.0"
description = "Split a team's tips fairly, to the cent."
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=tips_splitter --cov-report=term-missing --cov-fail-under=90"
